# scheme_ports.conf — runtime scheme definitions. Overrides builtins.
# Format: <scheme> <port> <flags>
#   flags: p=has-port h=no-host o=opaque t=tls
# blank lines and lines starting with # are ignored.
#
# Examples (uncomment to add):
#
# myscheme 12345 p
# custom   0     pho
# tor-bridge 0   p


