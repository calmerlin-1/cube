# Runtime TLS profiles for cube.
# Add new browser releases here; no C changes or rebuild required.
# Format: INI-like, values comma/space separated. Comments: # or ;

[cube-modern]
display = Cube modern (TLS 1.3 only)
user_agent = cube/1.0
tls_min = 1.3
tls_max = 1.3
alpn = h2,http/1.1
ciphers = 0x1301, 0x1302, 0x1303
groups = 0x001d, 0x0017, 0x0018
sigalgs = 0x0403, 0x0503, 0x0603, 0x0804
extensions = 0, 23, 65281, 10, 11, 13, 16, 43, 45, 51
grease = 0

# Example: clone a browser profile for a new release.
# [chrome-132]
# display = Chrome 132 on Linux x86_64
# user_agent = Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36
# tls_min = 1.2
# tls_max = 1.3
# alpn = h2,http/1.1
# ciphers = 0x1301, 0x1302, 0x1303
# ciphers12 = 0xcca9, 0xcca8, 0xc02f, 0xc030, 0xc02b, 0xc02c
# groups = 0x001d, 0x0017, 0x0018
# sigalgs = 0x0403, 0x0503, 0x0603, 0x0804, 0x0805, 0x0806
# extensions = 0, 23, 65281, 10, 11, 13, 16, 45, 43, 51
# grease = 1
