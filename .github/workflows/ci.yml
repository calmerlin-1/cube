name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: Build
        run: make clean && make
      - name: Test
        run: make test
      - name: Smoke
        run: ./cube --help && printf '{"a":1}' | ./cube --check-json

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install libsodium pkg-config
      - name: Configure Homebrew paths
        run: |
          echo "CPATH=$(brew --prefix libsodium)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix libsodium)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libsodium)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build
        run: make clean && make
      - name: Test
        run: make test
      - name: Smoke
        run: ./cube --help && printf '{"a":1}' | ./cube --check-json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsodium
      - name: Build
        shell: msys2 {0}
        run: make clean && make CC=gcc AR=ar RANLIB=ranlib
      - name: Smoke
        shell: msys2 {0}
        run: ./cube --help
